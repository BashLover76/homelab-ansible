---
- name: Configurer le DNS ADM existant avec sauvegarde
  hosts: nas
  become: true
  gather_facts: false
  module_defaults:
    ansible.builtin.uri:
      url_username: homelab
      url_password: "{{ adguard_admin_password }}"
      force_basic_auth: true
      timeout: 10
  tasks:
    - name: Lire la configuration existante
      ansible.builtin.uri:
        url: http://NAS_IP:8030/control/dns_info
      register: current_dns
      no_log: true
    - name: Créer le dossier de sauvegarde protégé
      ansible.builtin.file:
        path: /volume1/Docker/backups/adguard
        state: directory
        mode: '0700'
    - name: Sauvegarder le routage DNS initial une seule fois
      ansible.builtin.copy:
        content: "{{ current_dns.json | to_nice_json }}"
        dest: /volume1/Docker/backups/adguard/dns-before-adguard-standalone.json
        force: false
        mode: '0600'
      no_log: true
    - name: Utiliser des DNS publics comme amonts AdGuard
      ansible.builtin.uri:
        url: http://NAS_IP:8030/control/dns_config
        method: POST
        body_format: json
        body:
          upstream_dns: ['https://dns10.quad9.net/dns-query', 'https://cloudflare-dns.com/dns-query']
      when: current_dns.json.upstream_dns != ['https://dns10.quad9.net/dns-query', 'https://cloudflare-dns.com/dns-query']
      changed_when: true
      no_log: true
    - name: Vérifier la résolution publique via AdGuard
      ansible.builtin.command:
        argv: [nslookup, example.com, NAS_IP]
      register: adguard_probe
      changed_when: false
      failed_when: adguard_probe.rc != 0 or adguard_probe.stdout | trim | length == 0
    - name: Vérifier le sous-domaine local Grafana
      ansible.builtin.command:
        argv: [nslookup, grafana.PUBLIC_DOMAIN, NAS_IP]
      register: local_dns_probe
      changed_when: false
      failed_when: "'NAS_IP' not in local_dns_probe.stdout"
