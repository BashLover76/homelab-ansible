---
- name: Vérifier la présence des paramètres sans exposer les secrets
  hosts: nas
  gather_facts: false
  tasks:
    - name: Afficher uniquement la présence des variables attendues
      ansible.builtin.debug:
        msg:
          alert_email_enabled: "{{ alert_email_enabled | default(false) | bool }}"
          smtp_smarthost_present: "{{ smtp_smarthost | default('') | length > 0 }}"
          smtp_from_present: "{{ smtp_from | default('') | length > 0 }}"
          smtp_username_present: "{{ smtp_username | default('') | length > 0 }}"
          smtp_password_present: "{{ smtp_password | default('') | length > 0 }}"
          homeassistant_username_present: "{{ homeassistant_username | default('') | length > 0 }}"
          homeassistant_password_present: "{{ homeassistant_password | default('') | length > 0 }}"
          github_billing_token_present: "{{ github_billing_token | default('') | length > 0 }}"
          freebox_base_url_present: "{{ freebox_base_url | default('') | length > 0 }}"
          freebox_ip_present: "{{ freebox_ip | default('') | length > 0 }}"
          freebox_username_present: "{{ (freebox_username | default(freebox_user | default(''))) | length > 0 }}"
          freebox_password_present: "{{ freebox_password | default('') | length > 0 }}"
          freebox_app_token_present: "{{ freebox_app_token | default('') | length > 0 }}"
          trakt_client_id_present: "{{ homelab_dashboard_trakt_client_id | default('') | length > 0 }}"
          trakt_access_token_present: "{{ homelab_dashboard_trakt_access_token | default('') | length > 0 }}"
          sonarr_url_present: "{{ homelab_dashboard_sonarr_url | default('') | length > 0 }}"
          sonarr_api_key_present: "{{ homelab_dashboard_sonarr_api_key | default('') | length > 0 }}"
          tmdb_api_key_present: "{{ homelab_dashboard_tmdb_api_key | default('') | length > 0 }}"
          betaseries_api_key_present: "{{ (homelab_dashboard_betaseries_api_key | default(betaseries_api_key | default(betaseries_apikey | default(''), true), true)) | length > 0 }}"
          betaseries_token_present: "{{ (homelab_dashboard_betaseries_token | default(betaseries_token | default(betaseries_oauth2 | default(''), true), true)) | length > 0 }}"
          betaseries_user_id_present: "{{ (homelab_dashboard_betaseries_user_id | default(betaseries_user_id | default(''), true)) | length > 0 }}"
          betaseries_login_present: "{{ (homelab_dashboard_betaseries_login | default(betaseries_login | default(''), true)) | length > 0 }}"
          google_calendar_ical_present: "{{ (homelab_dashboard_google_calendar_ical_url | default(google_calendar_ical_url | default(''))) | length > 0 }}"
          streaming_feeds_json_present: "{{ homelab_dashboard_streaming_feeds_json | default('') | length > 0 }}"
