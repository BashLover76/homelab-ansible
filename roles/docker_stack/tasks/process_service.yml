---
- name: Charger les variables spécifiques du service
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/services/{{ service_name }}.yml"
    name: service_vars


- name: Debug du domaine du service
  ansible.builtin.debug:
    msg: "Domaine résolu : {{ service_vars.service_domain | default('non configuré') }}"

- name: Créer le dossier du service
  ansible.builtin.file:
    path: "{{ stacks_base_path }}/{{ service_name }}"
    state: directory

- name: Générer le fichier .env dynamiquement
  ansible.builtin.copy:
    content: |
      COMPOSE_PROFILES={{ docker_profile }}
      {% for key, value in (service_vars.service_envs | default({})).items() %}
      {{ key }}={{ value }}
      {% endfor %}
    dest: "{{ stacks_base_path }}/{{ service_name }}/.env"
    owner: homelab
    group: docker
    mode: '0600'

- name: Inclure les fichiers de configuration spécifiques optionnels
  ansible.builtin.include_tasks: "services/custom/{{ service_name }}.yml"
  when: lookup('fileglob', 'services/custom/' ~ service_name ~ '.yml') | length > 0

- name: Déployer et lancer le Docker Compose
  ansible.builtin.include_tasks: deploy_service.yml
  vars:
    item: { name: "{{ service_name }}" }
    service_ports: "{{ service_vars.service_ports | default([]) }}"
    service_port: "{{ service_vars.service_port | default('') }}"
    service_path: "{{ service_vars.service_path | default('') }}"
    service_domain: "{{ service_vars.service_domain | default('') }}"
    service_forward_host: "{{ service_vars.service_forward_host | default(nas_ip) }}"
    service_forward_port: "{{ service_vars.service_forward_port | default(service_vars.service_port | default('')) }}"
    prometheus_route_prefix: "{{ service_vars.prometheus_route_prefix | default('') }}"
    prometheus_external_url: "{{ service_vars.prometheus_external_url | default('') }}"

- name: Valider la santé du conteneur
  ansible.builtin.include_tasks: health_check.yml
  vars:
    item: { name: "{{ service_name }}" }

- name: Exécuter les actions post-déploiement spécifiques optionnelles
  ansible.builtin.include_tasks: "services/post_deploy/{{ service_name }}.yml"
  when: lookup('fileglob', 'services/post_deploy/' ~ service_name ~ '.yml') | length > 0

- name: Configurer automatiquement le Proxy Host NPM si requis
  ansible.builtin.include_tasks: configure_proxy.yml
  when: 
    - service_vars.service_domain is defined
    - service_vars.service_path is defined
    - inventory_hostname == 'nas'
  vars:
    service_domain: "{{ service_vars.service_domain }}"
    service_path: "{{ service_vars.service_path }}"
    service_port: "{{ service_vars.service_port }}"
    service_forward_host: "{{ service_vars.service_forward_host | default(nas_ip) }}"
    service_forward_port: "{{ service_vars.service_forward_port | default(service_vars.service_port) }}"
