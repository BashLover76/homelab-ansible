---
- name: Créer le réseau interne Homelab pour le runner
  ansible.builtin.command:
    argv: [docker, network, create, homelab_internal]
  register: homelab_internal_network
  changed_when: homelab_internal_network.rc == 0
  failed_when:
    - homelab_internal_network.rc != 0
    - "'already exists' not in homelab_internal_network.stderr"

- name: Déployer le runner de mises à jour
  ansible.builtin.template:
    src: homelab-updater.py.j2
    dest: "{{ stacks_base_path }}/homelab-updater/homelab-updater.py"
    owner: homelab
    group: docker
    mode: '0750'
  no_log: true
