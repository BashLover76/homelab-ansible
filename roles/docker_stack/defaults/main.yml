homelab_dashboard_streaming_feeds_json: "{}"
homelab_dashboard_trakt_client_id: ""
homelab_dashboard_trakt_access_token: ""
homelab_dashboard_sonarr_url: ""
homelab_dashboard_sonarr_api_key: ""
homelab_dashboard_tmdb_api_key: ""
homelab_dashboard_betaseries_api_key: ""
homelab_dashboard_betaseries_token: ""
homelab_dashboard_betaseries_user_id: ""
homelab_dashboard_betaseries_login: ""
freebox_base_url: "http://{{ freebox_ip }}"
freebox_username: ""
freebox_password: ""
freebox_app_token: ""
