---
- name: Vérifier la chaîne de supervision
  hosts: nas
  become: true
  gather_facts: false
  tasks:
    - name: Valider la configuration Prometheus et ses règles
      ansible.builtin.command: docker exec prometheus promtool check config /etc/prometheus/prometheus.yml
      changed_when: false
    - name: Lire les cibles Prometheus
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/api/v1/targets
        timeout: 10
      register: targets
      retries: 5
      delay: 3
      until:
        - targets.json.data.activeTargets | length >= 8
        - targets.json.data.activeTargets | rejectattr('health', 'equalto', 'up') | list | length == 0
    - name: Exiger des cibles toutes disponibles
      ansible.builtin.assert:
        that:
          - targets.json.data.activeTargets | length >= 8
          - targets.json.data.activeTargets | rejectattr('health', 'equalto', 'up') | list | length == 0
    - name: Vérifier les séries utilisées par les panneaux
      ansible.builtin.uri:
        url: "http://127.0.0.1:9090/api/v1/query?query={{ item | urlencode }}"
        timeout: 10
      loop:
        - node_uname_info
        - docker_container_state
        - rate(docker_container_cpu_usage_seconds_total[5m])
        - docker_container_memory_usage_bytes
        - rate(docker_container_fs_reads_bytes_total[5m])
        - rate(docker_container_fs_writes_bytes_total[5m])
        - rate(docker_container_network_receive_bytes_total[5m])
        - rate(docker_container_network_transmit_bytes_total[5m])
        - wud_containers
      register: metrics
      failed_when: metrics.json.data.result | length == 0
    - name: Vérifier Alertmanager
      ansible.builtin.uri:
        url: http://NAS_IP:9093/-/ready
        timeout: 10
